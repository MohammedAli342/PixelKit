
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | PixelKit</title>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8Z2CZM892J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8Z2CZM892J');
  </script>

  <meta name="description" content="Get in touch with the PixelKit team for support, feedback, or inquiries.">
  <meta name="keywords" content="contact pixelkit, support, feedback, help, get in touch">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            'brand-cyan': '#22D3EE',
            'brand-magenta': '#F472B6',
            'brand-dark': '#0F172A',
          },
           animation: {
            fadeIn: 'fadeIn 0.5s ease-in-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0, transform: 'translateY(10px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-200">
  <div id="app" class="flex flex-col min-h-screen">
    <header class="relative z-50">
      <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center gap-3 text-2xl font-bold text-white">
          <img src="/logo.svg" alt="PixelKit Logo" class="h-8 w-8" />
          <span>PixelKit</span>
        </a>
        <div class="flex items-center space-x-4 md:space-x-6">
          <div class="hidden md:flex items-center space-x-6">
            <a href="/faq.html" class="text-slate-300 hover:text-white transition-colors" data-t="header.faq">FAQ</a>
            <a href="/contact.html" class="text-slate-300 hover:text-white transition-colors" data-t="header.contact">Contact</a>
          </div>
          <div id="language-selector-container"></div>
        </div>
      </nav>
    </header>

    <main class="flex-grow">
      <div id="hero-container">
        <div class="py-16 text-center">
            <div class="container mx-auto px-4 relative z-10">
            <div class="absolute top-0 left-4 md:left-0 z-20">
                <a href="/" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                    <div class="p-2 bg-white/5 rounded-full group-hover:bg-white/10 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span class="hidden md:inline font-medium" data-t="common.back">Back</span>
                </a>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-4" style="text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);" data-t="contact.hero.title">Contact Us</h1>
            <p class="text-lg text-slate-300 max-w-2xl mx-auto" data-t="contact.hero.subtitle">Have a question or feedback? We'd love to hear from you.</p>
            </div>
        </div>
      </div>
      <div class="py-16">
        <div class="container mx-auto px-4 max-w-xl" id="contact-content-container">
          {/* Form or success message is rendered here by JS */}
        </div>
      </div>
    </main>

    <footer class="border-t border-white/10 mt-20">
      <div class="container mx-auto px-4 py-8 text-center text-slate-400">
        <p class="mb-4" data-t="footer.copyright">© 2025 PixelKit. All Rights Reserved.</p>
        <div class="flex justify-center space-x-6">
          <a href="/privacy-policy.html" class="hover:text-brand-cyan transition-colors" data-t="footer.privacy">Privacy Policy</a>
          <a href="/terms-of-use.html" class="hover:text-brand-cyan transition-colors" data-t="footer.terms">Terms of Use</a>
          <a href="/contact.html" class="hover:text-brand-cyan transition-colors" data-t="footer.contact">Contact Us</a>
        </div>
      </div>
    </footer>
  </div>
  
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/contact.js"></script>
</body>
</html>
